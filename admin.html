<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KJBTC Admin</title>
<style>
body{background:#0B1A3A;color:#fff;font-family:Arial;margin:0}
.top{background:#F7931A;padding:16px;text-align:center;font-size:22px;font-weight:900;color:#000}
.c{padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;color:#0B1A3A;border-radius:20px;padding:18px;margin-top:14px}
.btn{background:#F7931A;color:#000;border:none;padding:15px;width:100%;border-radius:14px;font-size:16px;font-weight:800;margin-top:10px;cursor:pointer}
.btn.g{background:#00C853;color:#fff}.btn.r{background:#FF3B30;color:#fff}.btn.w{background:#fff;color:#0052FF;border:2px solid #0052FF}
input{width:100%;padding:14px;border:2px solid #D6E0FF;border-radius:14px;margin-top:10px;font-size:16px}
.small{color:#5A6A8A;font-size:12px}
.payout{background:#F2F6FF;border-radius:16px;padding:14px;margin-top:10px;border-left:5px solid #FFB800}
.payout.paid{border-left-color:#00C853;background:#E6F7EE}
.payout.rejected{border-left-color:#FF3B30;background:#FFECEC}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;color:#fff;background:#FFB800}
.badge.paid{background:#00C853}.badge.rejected{background:#FF3B30}
.codebox{background:#0B1A3A;color:#FFB800;font-size:28px;font-weight:900;text-align:center;padding:16px;border-radius:14px;margin-top:10px;letter-spacing:3px}
.hidden{display:none}
</style></head>
<body>
<div class="top">KJBTC Admin 👑</div>
<div class="c">
<div id="loginBox" class="card">
<h2 style="margin:0;">Admin Login 🔒</h2>
<p class="small">PIN is <b>1234</b></p>
<input id="adminPin" type="number" placeholder="Enter PIN 1234">
<button class="btn" id="unlockBtn" type="button">Unlock Admin</button>
<p class="small" id="loginMsg" style="text-align:center;color:red;font-weight:bold;"></p>
</div>

<div id="dash" class="hidden">
<div class="card"><h3 style="margin:0;">📊 Stats</h3><p>Requests: <b id="totalReq">0</b> | Pending BTC: <b id="totalPending">0.00000000</b> | Paid BTC: <b id="totalPaid">0.00000000</b></p></div>
<div class="card"><h3 style="margin:0;">🔑 Generate Redeem Code</h3><p class="small">Generate code, send to user on WhatsApp. User redeems on site.</p><button class="btn g" id="genBtn" type="button">🔑 Generate Code for 0.00005 BTC</button><div id="codeOut"></div></div>
<div class="card"><h3 style="margin:0;">➕ Add Test Payout</h3><input id="testWallet" placeholder="User BTC Wallet"><input id="testAmt" type="number" step="0.00000001" placeholder="Amount BTC e.g. 0.00005"><button class="btn g" id="addBtn" type="button">Add Request</button></div>
<div class="card"><h3 style="margin:0;">💸 Payout Requests</h3><div id="list">Loading...</div><button class="btn w" id="clearBtn" type="button">🗑️ Clear All</button><br><button class="btn w" onclick="window.location.href='index.html'">← Back To Site</button></div>
</div>
</div>

<script>
// --- LOGIN - SIMPLE, NO DEPENDENCIES ---
document.getElementById("unlockBtn").onclick = function(){
  var pin = document.getElementById("adminPin").value.trim();
  // Debug: show what was typed
  if(pin === "1234" || pin === "1234 "){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dash").classList.remove("hidden");
    showPayouts();
    alert("✅ Unlocked! Welcome Admin");
  } else {
    document.getElementById("loginMsg").innerText = "❌ Wrong PIN! You typed: [" + pin + "] - Type 1234";
    alert("Wrong PIN. You typed: " + pin + " - Correct is 1234");
  }
};

function getReqs(){ try{ return JSON.parse(localStorage.getItem("kjbtc_payouts")||"[]"); }catch(e){ return []; } }
function saveReqs(a){ localStorage.setItem("kjbtc_payouts", JSON.stringify(a)); showPayouts(); }
function toBTC(s){ return (s/100000000).toFixed(8); }
function toSats(b){ return Math.round(b*100000000); }

document.getElementById("genBtn").onclick = function(){
  var code = "KJ" + Math.floor(1000 + Math.random()*9000);
  document.getElementById("codeOut").innerHTML = "<div class='codebox'>"+code+"</div><p class='small' style='text-align:center;'>Send this to user. User enters it in Redeem Box → Gets +0.00005 BTC</p>";
  alert("CODE: " + code + " - Copy and send to user!");
};

document.getElementById("addBtn").onclick = function(){
  var w = document.getElementById("testWallet").value.trim();
  var btc = parseFloat(document.getElementById("testAmt").value||0);
  var sats = toSats(btc);
  if(w.length < 10 || sats < 5000){ alert("Min 0.00005 BTC and valid wallet"); return; }
  var arr = getReqs();
  arr.unshift({wallet:w, amount:sats, btc:btc.toFixed(8), status:"pending", time:new Date().toLocaleString(), tx:""});
  saveReqs(arr);
  alert("Added!");
};

document.getElementById("clearBtn").onclick = function(){
  if(confirm("Delete ALL?")){ localStorage.removeItem("kjbtc_payouts"); showPayouts(); }
};

function approve(i){
  var arr = getReqs(); var r = arr[i];
  var tx = prompt("Pay " + r.btc + " BTC to:\n" + r.wallet + "\n\nPaste TX ID after paying:");
  if(tx === null) return;
  if(!tx) tx = "MANUAL-"+Date.now();
  r.status = "paid"; r.tx = tx; r.code = "KJ" + Math.floor(1000+Math.random()*9000);
  saveReqs(arr);
  alert("✅ PAID! CODE FOR USER: " + r.code + "\nSend this code to user!");
}
function reject(i){
  if(!confirm("Reject?")) return;
  var arr = getReqs(); arr[i].status = "rejected"; saveReqs(arr);
}

function showPayouts(){
  var arr = getReqs();
  document.getElementById("totalReq").innerText = arr.length;
  var pend = 0, paid = 0;
  for(var k=0;k<arr.length;k++){ if(arr[k].status==="pending") pend+=arr[k].amount; if(arr[k].status==="paid") paid+=arr[k].amount; }
  document.getElementById("totalPending").innerText = toBTC(pend);
  document.getElementById("totalPaid").innerText = toBTC(paid);
  if(arr.length===0){ document.getElementById("list").innerHTML = "No requests yet. Add a test one above."; return; }
  var html = "";
  for(var i=0;i<arr.length;i++){
    var r = arr[i];
    var cls = r.status==="paid"?"paid":r.status==="rejected"?"rejected":"";
    html += "<div class='payout "+cls+"'><b>₿ "+r.btc+" BTC</b> <span class='badge "+r.status+"'>"+r.status.toUpperCase()+"</span><br><span class='small'>"+r.wallet+"<br>"+r.time+(r.tx?"<br>TX: "+r.tx:"")+(r.code?"<br><b style='color:#F7931A;'>CODE: "+r.code+"</b>":"")+"</span><br>";
    if(r.status==="pending"){ html += "<button class='btn g' onclick='approve("+i+")'>✅ Approve & Mark Paid</button><button class='btn r' onclick='reject("+i+")'>❌ Reject</button>"; }
    html += "</div>";
  }
  document.getElementById("list").innerHTML = html;
}
</script>
</body></html>
